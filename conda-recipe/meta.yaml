{% set name = "ncountr" %}
{% set version = "0.2.0" %}
{% set python_min = "3.9" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/{{ name }}-{{ version }}.tar.gz
  sha256: 9062bef1d369081970fc822b5a86b3df1f4557d1aded89ff5eda78720fe1d831

build:
  noarch: python
  number: 0
  entry_points:
    - ncountr = ncountr.cli:cli
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python {{ python_min }}
    - pip
    - setuptools >=64
  run:
    - python >={{ python_min }}
    - numpy >=1.21
    - pandas >=1.3
    - scipy >=1.7
    - statsmodels >=0.13
    - matplotlib-base >=3.5
    - pyyaml >=5.4
    - click >=8.0

test:
  imports:
    - ncountr
    - ncountr.core
    - ncountr.io
    - ncountr.plotting
  requires:
    - python {{ python_min }}
    - pip
  commands:
    - pip check
    - ncountr --version
    - ncountr --help

about:
  home: https://github.com/princello/ncountr
  summary: Python pipeline for Nanostring nCounter data analysis
  description: |
    ncountr is a Python package for end-to-end nCounter data analysis.
    Parse RCC files, run QC, normalize, test for differential expression
    (Mann-Whitney U or t-test with FDR correction), and score gene sets —
    all from a single config file or Python API. Results can be exported
    as AnnData for downstream analysis with scanpy.
  license: MIT
  license_family: MIT
  license_file: LICENSE
  doc_url: https://ncountr.readthedocs.io
  dev_url: https://github.com/princello/ncountr

extra:
  recipe-maintainers:
    - princello
