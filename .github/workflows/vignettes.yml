name: Vignettes

# Full end-to-end execution of the tutorial notebooks.
#
# This is deliberately NOT part of the per-push CI: each notebook downloads its
# own RCC archive from NCBI GEO (1,458 samples across the five), so running it on
# every commit would make the main test matrix slow and network-dependent.
#
# The fast counterpart is tests/test_vignette_api.py, which statically checks
# every ncountr call in these notebooks against the live signatures and runs on
# every push as part of the normal pytest suite.

on:
  workflow_dispatch:
  schedule:
    # 05:00 UTC every Monday
    - cron: "0 5 * * 1"

concurrency:
  group: vignettes-${{ github.ref }}
  cancel-in-progress: true

jobs:
  execute:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 60

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: GSE275334 Long COVID
            notebook: examples/vignettes/GSE275334_long_covid.ipynb
          - name: GSE140901 HCC immunotherapy
            notebook: examples/vignettes/GSE140901_hcc_immunotherapy.ipynb
          - name: GSE117751 Autoimmune retinopathy
            notebook: examples/vignettes/GSE117751_autoimmune_retinopathy.ipynb
          - name: GSE268012 IFN macrophages
            notebook: examples/vignettes/GSE268012_ifn_macrophages.ipynb
          - name: GSE74821 PAM50 scale test
            notebook: examples/vignettes/GSE74821_breast_cancer_pam50.ipynb

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # crossplatform brings anndata/scanpy, which section 9 of the
          # Long COVID vignette needs; docs brings the myst-nb stack
          pip install -e ".[dev,crossplatform,docs]"
          # not guaranteed by the extras above, and required to execute
          pip install nbconvert nbclient ipykernel

      - name: Execute notebook
        env:
          NOTEBOOK: ${{ matrix.notebook }}
        run: |
          mkdir -p "$RUNNER_TEMP/executed"
          # --output-dir keeps the executed copy out of the working tree, so the
          # source notebooks are never modified and outputs are never committed
          jupyter nbconvert \
            --to notebook \
            --execute "$NOTEBOOK" \
            --ExecutePreprocessor.timeout=1800 \
            --output-dir "$RUNNER_TEMP/executed"

      - name: Confirm source notebook is unmodified
        run: git diff --exit-code -- examples/vignettes/

      - name: Upload executed notebook
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: executed-${{ github.run_id }}-${{ strategy.job-index }}
          path: ${{ runner.temp }}/executed/
          if-no-files-found: warn
          retention-days: 14
